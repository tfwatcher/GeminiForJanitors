# Keep the free Render web service warm with lightweight external traffic.
# This is a best-effort workaround, not a guarantee of 24/7 uptime.
# Do not use /health: that endpoint also calls Redis and Render's API.
name: Keep GeminiForJanitors Awake

on:
  schedule:
    # Every 10 minutes, away from the top of the hour.
    - cron: "3-53/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send lightweight keep-awake request
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --header 'Cache-Control: no-cache' \
            --output /dev/null \
            --write-out 'HTTP %{http_code}\n' \
            "https://geminiforjanitors-otpk.onrender.com/favicon.ico?keepawake=$(date +%s)"
